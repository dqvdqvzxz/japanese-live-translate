[project]
name = "jlt-backend"
version = "0.1.0"
description = "Japanese Live Translator backend — audio capture, OpenAI realtime STT, JA→VI translation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "websockets>=13.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "jsonschema>=4.23",
]

[project.scripts]
jlt-backend = "jlt.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jlt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
    # RUF001/2/3 flag "ambiguous" Unicode such as fullwidth Ａ or katakana ノ.
    # This codebase processes Japanese text, so those characters are the subject
    # matter and appear deliberately in patterns, test data and comments. The
    # rules would force us to obfuscate exactly the code that needs to be
    # readable.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jlt"]
mypy_path = "src"
warn_unused_ignores = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "pytest-asyncio>=1.4.0",
]
